<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Regalos San Esteban</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#ffffff; --card:#ffffff; --soft:#f7f7f8; --ink:#1f1f23; --muted:#6b6b76; --line:#e5e5ea;
  --red:#c0262d; --red-d:#9f1d23; --green:#1f7a4d; --green-bg:#e8f5ee; --gold:#b7791f; --gold-bg:#fff6dd;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px calc(110px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
h1{font:800 30px/1.1 Fraunces,Georgia,serif;margin:0;letter-spacing:-.5px}
h1 span{color:var(--red)}
.hello{color:var(--muted);margin:8px 0 18px;font-size:15px}
.hello b{color:var(--ink)}
.hello button{border:0;background:none;padding:0 0 0 6px;color:var(--red);font-size:14px;text-decoration:underline;cursor:pointer}
.langsw{display:flex;gap:6px;flex-shrink:0}
.langsw button{padding:4px;border-radius:8px;line-height:0;background:#fff}
.langsw button.on{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.flag{width:30px;height:20px;border-radius:3px;border:1px solid rgba(0,0,0,.15);display:block}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{flex:1;background:none;border:0;border-radius:0;padding:12px 8px;font:600 15px Inter,sans-serif;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--red);border-bottom-color:var(--red)}
.tab .n{background:var(--green-bg);color:var(--green);border-radius:99px;padding:1px 8px;font-size:12px;margin-left:6px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:inherit;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:44px;-webkit-appearance:none;appearance:none}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%236b6b76' stroke-width='2'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}
input[type=checkbox]{width:22px;height:22px;min-height:0;appearance:auto;-webkit-appearance:checkbox;accent-color:var(--red)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical;min-height:60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.item .grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:12px}
.item .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
.item .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.item .num{font:800 13px Fraunces,serif;color:var(--red);letter-spacing:.5px}
.specs{background:var(--soft);border:1px dashed var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.specs .t{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:10px}
.star{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none;text-transform:none;letter-spacing:0;font-weight:500;margin:0}
button{font:600 15px Inter,sans-serif;border-radius:10px;padding:10px 16px;min-height:44px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
button:hover{border-color:var(--red)}
.btn-main{background:var(--red);border-color:var(--red);color:#fff}
.btn-main:hover{background:var(--red-d)}
.btn-main[disabled]{opacity:.5;cursor:default}
.btn-del{color:var(--muted);padding:4px 12px;min-height:36px;font-size:14px}
.add{width:100%;border-style:dashed;padding:14px;color:var(--red)}
.savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:14px;align-items:center;z-index:5}
.savebar .msg{color:var(--muted);font-size:14px}
.savebar .msg.ok{color:var(--green)}
.savebar .msg.err{color:var(--red)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tools input{flex:1;min-width:180px}
.tools select{width:auto;min-width:150px}
.person h2{font:800 22px Fraunces,serif;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.person .count{font:500 13px Inter;color:var(--muted)}
.you{font:600 11px Inter;background:var(--gold-bg);color:var(--gold);padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.4px}
.gift{padding:12px 0;border-top:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.gift .name{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.gift .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--green-bg);color:var(--green);font-weight:600}
.chip.spec{background:var(--soft);border:1px solid var(--line);color:var(--ink);font-weight:500}
.chip.top{background:var(--gold-bg);color:var(--gold)}
.gift .notes{color:var(--muted);font-size:14px;margin-top:6px;overflow-wrap:anywhere}
a.link{white-space:nowrap;text-decoration:none;font-weight:600;font-size:14px;color:var(--red);border:1px solid var(--line);padding:9px 14px;border-radius:10px;text-align:center}
a.link:hover{border-color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.banner{background:var(--gold-bg);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:14px}

/* pantallas de entrada (idioma y nombre) */
.screen{position:fixed;inset:0;background:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;text-align:center;overflow-y:auto;transition:opacity .4s ease,transform .4s ease}
.screen.out{opacity:0;transform:translateY(-10px);pointer-events:none}
.screen[hidden]{display:none}
.screen .emoji{font-size:54px;line-height:1}
.screen p{color:var(--muted);margin:0;font-size:17px}
.screen h1{font-size:32px}
.fadein{animation:fadein .5s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.gate-btns{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.gate-btns button{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 26px;border-radius:18px;border:2px solid var(--line);min-width:160px;transition:transform .2s,border-color .2s}
.gate-btns button:hover,.gate-btns button:active{border-color:var(--red);transform:translateY(-2px)}
.gate-btns .flag{width:116px;height:77px;border-radius:6px}
.gate-btns span{font:800 20px Fraunces,serif}

.whobtn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:min(340px,100%);padding:16px 20px;font:800 20px Fraunces,serif;border:2px solid var(--line);border-radius:16px;background:#fff}
.whobtn .chev{transition:transform .3s;font-size:14px;color:var(--muted)}
.whobtn[aria-expanded=true]{border-color:var(--red)}
.whobtn[aria-expanded=true] .chev{transform:rotate(180deg)}
.wholist{width:min(340px,100%);max-height:0;overflow:hidden;opacity:0;transition:max-height .45s ease,opacity .35s ease;margin-top:-10px}
.wholist.open{max-height:700px;opacity:1}
.wholist .inner{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:6px}
.wholist button{font-weight:600;font-size:16px;padding:13px 8px;border-radius:12px}
.wholist button:active{background:var(--red);color:#fff;border-color:var(--red)}

@media (max-width:560px){
  .item .grid,.item .grid3{grid-template-columns:1fr}
  .gift{flex-direction:column}
  a.link{width:100%}
  h1{font-size:26px}
  .screen h1{font-size:28px}
  .gate-btns{gap:14px}
  .gate-btns .flag{width:92px;height:61px}
  .gate-btns button{min-width:140px;padding:16px 18px}
  .tools select{width:100%}
  .savebar{gap:10px}
  .savebar .msg{flex:1;font-size:13px;line-height:1.3}
  .savebar .btn-main{flex-shrink:0}
}
</style>
</head>
<body>

<!-- 1. Idioma -->
<div class="screen" id="gate">
  <div class="emoji">🎁</div>
  <p>Escoge idioma · Tria idioma</p>
  <div class="gate-btns" id="gatebtns"></div>
</div>

<!-- 2. Quién eres -->
<div class="screen" id="who" hidden>
  <div class="emoji">🎁</div>
  <h1 id="who-title"></h1>
  <button class="whobtn" id="whobtn" aria-expanded="false" aria-controls="wholist"><span id="whobtn-t"></span><span class="chev">▼</span></button>
  <div class="wholist" id="wholist"><div class="inner" id="whoinner"></div></div>
</div>

<div class="wrap">
  <div class="top">
    <h1>🎁 <span id="t-title"></span></h1>
    <div class="langsw" id="langsw"></div>
  </div>
  <p class="hello" id="hello"></p>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-mine" aria-selected="true"></button>
    <button class="tab" role="tab" id="tab-all" aria-selected="false"><span id="tab-all-t"></span><span class="n" id="count">0</span></button>
  </div>

  <div id="status" class="banner" hidden></div>
  <section id="view-mine"></section>
  <section id="view-all" hidden></section>
</div>

<div class="savebar" id="savebar">
  <span class="msg" id="savemsg"></span>
  <button class="btn-main" id="savebtn" disabled></button>
</div>

<script>
(function(){
  /* ---------- Configuración de Supabase (rellena estas dos líneas) ---------- */
  var CONFIG={url:"https://jvpeqphnsvttywhlbtrz.supabase.co",key:"sb_publishable_8F0Ob1lpe1fLT3pfkmR-vw_NrfkQU00"};
  var CONFIGURED=CONFIG.url.indexOf("TU-PROYECTO")<0&&CONFIG.key.indexOf("TU_CLAVE")<0;
  async function sb(method,path,body,extra){
    var headers={apikey:CONFIG.key};
    if(CONFIG.key.indexOf("eyJ")===0)headers.Authorization="Bearer "+CONFIG.key;
    if(body)headers["Content-Type"]="application/json";
    if(extra)for(var k in extra)headers[k]=extra[k];
    var r=await fetch(CONFIG.url+"/rest/v1/"+path,{method:method,headers:headers,body:body?JSON.stringify(body):undefined});
    if(!r.ok)throw new Error("HTTP "+r.status);
    return method==="GET"?r.json():null;
  }

  /* ---------- Personas ---------- */
  var PEOPLE=[
    {id:"joel",name:"Joel"},{id:"ona",name:"Ona"},{id:"Avia",name:"Avia"},{id:"Avi",name:"Avi"},
    {id:"cristina",name:"Cristina"},{id:"jona",name:"Jona"},{id:"paula",name:"Paula"},{id:"sergi",name:"Sergi"},
    {id:"monica",name:"Mónica"},{id:"sonia",name:"Sonia"},{id:"vicens",name:"Viçens"},{id:"dani",name:"Dani"},{id:"ana",name:"Ana"},{id:"aina",name:"Aina"}
  ];
  function personById(id){for(var i=0;i<PEOPLE.length;i++)if(PEOPLE[i].id===id)return PEOPLE[i];return null}

  /* ---------- Idiomas ---------- */
  var STR={
    es:{
      title:"Regalos San Esteban",
      whoQ:"¿Quién eres?",whoPick:"Elige tu nombre",
      hello:"Hola, ",notMe:"No soy yo",
      tabMine:"Mi lista",tabAll:"Listas del grupo",
      gift:"REGALO",remove:"Quitar",what:"¿Qué es?",whatPh:"Ej.: Sudadera con capucha",type:"Tipo",link:"Enlace",
      specs:"Especificaciones (rellena lo que haga falta)",size:"Talla",sizePh:"Ej.: M, 38, 90 cm…",sizeShoe:"Ej.: 42",
      color:"Color",colorPh:"Ej.: negro",price:"Precio aprox.",pricePh:"Ej.: 25 €",
      other:"Otros detalles (modelo, marca, versión…)",otherPh:"Ej.: modelo Air Max, versión de 500 ml…",
      fav:"⭐ Es el que más ilusión me hace",add:"+ Añadir regalo",
      save:"Guardar",loading:"Cargando…",ready:"Listo",unsaved:"Cambios sin guardar",saving:"Guardando…",
      saved:"✓ Guardado. Ya lo ve todo el grupo",saveErr:"No se pudo guardar. Inténtalo de nuevo",
      offline:"Sin conexión",
      needLogin:"No se pudo conectar con la base de datos. Revisa tu conexión y recarga la página.",
      slow:"Está tardando en cargar. Recarga la página si no aparece nada.",loadErr:"No se pudieron cargar las listas.",
      search:"Buscar persona o regalo…",allTypes:"Todos los tipos",
      you:"Tú",oneGift:"regalo",manyGifts:"regalos",nothingYet:"Todavía no ha añadido nada.",
      favChip:"⭐ Favorito",sizeChip:"Talla: ",colorChip:"Color: ",noName:"(sin nombre)",viewLink:"Ver enlace ↗",
      noMatch:"Nada coincide con la búsqueda.",
      cats:{ropa:"Ropa",calzado:"Calzado",accesorio:"Accesorio",tecnologia:"Tecnología",hogar:"Hogar",belleza:"Belleza",libros:"Libros y juegos",experiencia:"Experiencia",otro:"Otro"}
    },
    ca:{
      title:"Regals Sant Esteve",
      whoQ:"Qui ets?",whoPick:"Escull el teu nom",
      hello:"Hola, ",notMe:"No sóc jo",
      tabMine:"La meva llista",tabAll:"Llistes del grup",
      gift:"REGAL",remove:"Treure",what:"Què és?",whatPh:"Ex.: Dessuadora amb caputxa",type:"Tipus",link:"Enllaç",
      specs:"Especificacions (omple el que calgui)",size:"Talla",sizePh:"Ex.: M, 38, 90 cm…",sizeShoe:"Ex.: 42",
      color:"Color",colorPh:"Ex.: negre",price:"Preu aprox.",pricePh:"Ex.: 25 €",
      other:"Altres detalls (model, marca, versió…)",otherPh:"Ex.: model Air Max, versió de 500 ml…",
      fav:"⭐ És el que em fa més il·lusió",add:"+ Afegir regal",
      save:"Desar",loading:"Carregant…",ready:"A punt",unsaved:"Canvis sense desar",saving:"Desant…",
      saved:"✓ Desat. Ja ho veu tot el grup",saveErr:"No s'ha pogut desar. Torna-ho a provar",
      offline:"Sense connexió",
      needLogin:"No s'ha pogut connectar amb la base de dades. Revisa la connexió i recarrega la pàgina.",
      slow:"Està tardant a carregar. Recarrega la pàgina si no apareix res.",loadErr:"No s'han pogut carregar les llistes.",
      search:"Cerca persona o regal…",allTypes:"Tots els tipus",
      you:"Tu",oneGift:"regal",manyGifts:"regals",nothingYet:"Encara no ha afegit res.",
      favChip:"⭐ Preferit",sizeChip:"Talla: ",colorChip:"Color: ",noName:"(sense nom)",viewLink:"Veure enllaç ↗",
      noMatch:"Res no coincideix amb la cerca.",
      cats:{ropa:"Roba",calzado:"Calçat",accesorio:"Accessori",tecnologia:"Tecnologia",hogar:"Llar",belleza:"Bellesa",libros:"Llibres i jocs",experiencia:"Experiència",otro:"Altre"}
    }
  };
  var CATS=["ropa","calzado","accesorio","tecnologia","hogar","belleza","libros","experiencia","otro"];
  var LEGACY={"Ropa":"ropa","Calzado":"calzado","Accesorio":"accesorio","Tecnología":"tecnologia","Hogar":"hogar","Belleza":"belleza","Libros y juegos":"libros","Experiencia":"experiencia","Otro":"otro"};
  function catCode(c){return LEGACY[c]||c||"otro"}

  var lang="es",hasLang=false,whoId=null;
  try{
    if(location.hash==="#inicio"){localStorage.removeItem("ai_lang");localStorage.removeItem("ai_who");history.replaceState(null,"",location.pathname+location.search)}
    var sv=localStorage.getItem("ai_lang");if(sv==="es"||sv==="ca"){lang=sv;hasLang=true}
    var sw=localStorage.getItem("ai_who");if(sw&&personById(sw))whoId=sw;
  }catch(e){}
  function t(k){return STR[lang][k]}
  function catName(c){c=catCode(c);return STR[lang].cats[c]||c}

  /* ---------- Banderas (SVG) ---------- */
  var SVGNS="http://www.w3.org/2000/svg";
  function flag(code){
    var s=document.createElementNS(SVGNS,"svg");
    s.setAttribute("viewBox","0 0 90 60");s.setAttribute("class","flag");s.setAttribute("aria-hidden","true");
    function r(y,hh,fill){var e=document.createElementNS(SVGNS,"rect");e.setAttribute("x","0");e.setAttribute("y",y);e.setAttribute("width","90");e.setAttribute("height",hh);e.setAttribute("fill",fill);s.appendChild(e)}
    if(code==="es"){r(0,15,"#AA151B");r(15,30,"#F1BF00");r(45,15,"#AA151B")}
    else{r(0,60,"#FCDD09");for(var i=1;i<9;i+=2)r(i*60/9,60/9,"#DA121A")}
    return s;
  }

  /* ---------- Utilidades ---------- */
  var db=null,all={},draft={items:[]},dirty=false,loaded=false,saving=false,tab="mine",statusKey=null;
  var filters={q:"",cat:""};
  function h(tag,attrs){
    var el=document.createElement(tag);
    if(attrs)for(var k in attrs){
      var v=attrs[k];
      if(k==="class")el.className=v;
      else if(k.slice(0,2)==="on")el.addEventListener(k.slice(2),v);
      else if(v===true)el.setAttribute(k,"");
      else if(v!==false&&v!=null)el.setAttribute(k,v);
    }
    for(var i=2;i<arguments.length;i++){
      var c=arguments[i];
      if(c==null||c===false)continue;
      el.appendChild(typeof c==="string"?document.createTextNode(c):c);
    }
    return el;
  }
  function uuid(){return "i"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
  function newItem(){return{id:uuid(),name:"",cat:"ropa",url:"",price:"",size:"",color:"",notes:"",top:false}}
  function safeUrl(u){
    u=(u||"").trim(); if(!u)return "";
    if(!/^https?:\/\//i.test(u))u="https://"+u;
    try{var x=new URL(u);return (x.protocol==="http:"||x.protocol==="https:")?x.href:""}catch(e){return ""}
  }
  var msgKey="loading",msgCls="";
  function setMsg(key,cls){msgKey=key;msgCls=cls||"";var m=document.getElementById("savemsg");m.textContent=t(key);m.className="msg"+(cls?" "+cls:"")}
  function markDirty(){dirty=true;setMsg("unsaved");document.getElementById("savebtn").disabled=false}
  function showBanner(key){statusKey=key;var b=document.getElementById("status");b.textContent=t(key);b.hidden=false}

  /* ---------- Pantallas con transición ---------- */
  function hideScreen(el,cb){
    el.classList.add("out");
    setTimeout(function(){el.hidden=true;el.classList.remove("out");if(cb)cb()},400);
  }
  function showScreen(el){el.hidden=false;el.classList.remove("out");
    Array.prototype.forEach.call(el.children,function(c,i){c.classList.remove("fadein");void c.offsetWidth;c.style.animationDelay=(i*0.08)+"s";c.classList.add("fadein")});
  }

  /* ---------- Mi lista ---------- */
  function field(label,input){return h("div",null,h("label",null,label),input)}
  function bind(el,obj,key){
    el.value=obj[key]||"";
    el.addEventListener("input",function(){obj[key]=el.value;markDirty()});
    return el;
  }
  function renderMine(){
    var root=document.getElementById("view-mine");
    root.textContent="";
    if(!whoId)return;
    draft.items.forEach(function(it,idx){
      it.cat=catCode(it.cat);
      var cat=h("select");
      CATS.forEach(function(c){cat.appendChild(h("option",{value:c},catName(c)))});
      cat.value=it.cat;
      cat.addEventListener("change",function(){it.cat=cat.value;markDirty();renderMine()});
      var top=h("input",{type:"checkbox"});top.checked=!!it.top;
      top.addEventListener("change",function(){it.top=top.checked;markDirty()});

      var specs=h("div",{class:"specs"},
        h("div",{class:"t"},t("specs")),
        h("div",{class:"grid3"},
          field(t("size"),bind(h("input",{type:"text",placeholder:it.cat==="calzado"?t("sizeShoe"):t("sizePh"),maxlength:"30"}),it,"size")),
          field(t("color"),bind(h("input",{type:"text",placeholder:t("colorPh"),maxlength:"30"}),it,"color")),
          field(t("price"),bind(h("input",{type:"text",placeholder:t("pricePh"),maxlength:"20"}),it,"price"))
        ),
        field(t("other"),bind(h("textarea",{rows:"2",maxlength:"300",placeholder:t("otherPh")}),it,"notes"))
      );

      root.appendChild(h("div",{class:"card item"},
        h("div",{class:"head"},
          h("span",{class:"num"},t("gift")+" "+(idx+1)),
          h("button",{class:"btn-del",type:"button",onclick:function(){
            draft.items.splice(idx,1);markDirty();renderMine();
          }},t("remove"))
        ),
        h("div",{class:"grid"},
          field(t("what"),bind(h("input",{type:"text",placeholder:t("whatPh"),maxlength:"80"}),it,"name")),
          field(t("type"),cat)
        ),
        h("div",{style:"margin-bottom:12px"},field(t("link"),bind(h("input",{type:"url",inputmode:"url",autocapitalize:"off",placeholder:"https://…",maxlength:"500"}),it,"url"))),
        specs,
        h("label",{class:"star"},top,t("fav"))
      ));
    });

    root.appendChild(h("button",{class:"add",type:"button",onclick:function(){
      draft.items.push(newItem());markDirty();renderMine();
      var cards=document.querySelectorAll(".item");
      var last=cards[cards.length-1];
      if(last){last.scrollIntoView({behavior:"smooth",block:"center"})}
    }},t("add")));
  }
  function loadDraft(){
    var mine=all[whoId];
    draft={items:mine&&mine.items?mine.items.map(function(i){return Object.assign(newItem(),i)}):[]};
    if(!draft.items.length)draft.items.push(newItem());
    dirty=false;document.getElementById("savebtn").disabled=true;
    setMsg("ready");renderMine();
  }

  /* ---------- Listas del grupo ---------- */
  function renderAll(){
    var root=document.getElementById("view-all");
    root.textContent="";
    var q=h("input",{type:"search",placeholder:t("search"),value:filters.q});
    q.addEventListener("input",function(){filters.q=q.value;renderList()});
    var cat=h("select",null,h("option",{value:""},t("allTypes")));
    CATS.forEach(function(c){cat.appendChild(h("option",{value:c},catName(c)))});
    cat.value=filters.cat;
    cat.addEventListener("change",function(){filters.cat=cat.value;renderList()});
    root.appendChild(h("div",{class:"tools"},q,cat));
    root.appendChild(h("div",{id:"list"}));
    renderList();
  }
  function withItems(){return PEOPLE.filter(function(p){return all[p.id]&&(all[p.id].items||[]).length}).length}
  function renderList(){
    var list=document.getElementById("list");if(!list)return;
    list.textContent="";
    var people=PEOPLE.slice().sort(function(a,b){return a.name.localeCompare(b.name,lang)});
    var q=filters.q.trim().toLowerCase(),shown=0;
    people.forEach(function(p){
      var d=all[p.id]||{},n=(d.items||[]).length;
      var items=(d.items||[]).filter(function(it){
        if(filters.cat&&catCode(it.cat)!==filters.cat)return false;
        if(!q)return true;
        if(p.name.toLowerCase().indexOf(q)>-1)return true;
        return [it.name,it.notes,it.color,it.size].join(" ").toLowerCase().indexOf(q)>-1;
      });
      if(filters.cat&&!items.length)return;
      if(q&&!items.length&&p.name.toLowerCase().indexOf(q)<0)return;
      shown++;
      var card=h("div",{class:"card person"},
        h("h2",null,p.name,p.id===whoId?h("span",{class:"you"},t("you")):null,
          h("span",{class:"count"},n+" "+(n===1?t("oneGift"):t("manyGifts"))))
      );
      if(!items.length)card.appendChild(h("div",{style:"color:var(--muted);margin-top:10px;font-size:14px"},t("nothingYet")));
      items.slice().sort(function(a,b){return (b.top?1:0)-(a.top?1:0)}).forEach(function(it){
        var meta=h("div",{class:"meta"},
          it.top?h("span",{class:"chip top"},t("favChip")):null,
          h("span",{class:"chip"},catName(it.cat)),
          it.size?h("span",{class:"chip spec"},t("sizeChip")+it.size):null,
          it.color?h("span",{class:"chip spec"},t("colorChip")+it.color):null,
          it.price?h("span",{class:"chip spec"},it.price):null
        );
        var u=safeUrl(it.url);
        card.appendChild(h("div",{class:"gift"},
          h("div",null,
            h("div",{class:"name"},it.name||t("noName")),
            meta,
            it.notes?h("div",{class:"notes"},it.notes):null
          ),
          u?h("a",{class:"link",href:u,target:"_blank",rel:"noopener noreferrer"},t("viewLink")):null
        ));
      });
      list.appendChild(card);
    });
    if(!shown)list.appendChild(h("div",{class:"empty"},t("noMatch")));
    document.getElementById("count").textContent=withItems();
  }

  /* ---------- Textos estáticos e idioma ---------- */
  function applyStatic(){
    document.documentElement.lang=lang;
    document.title=t("title");
    document.getElementById("t-title").textContent=t("title");
    document.getElementById("tab-mine").textContent=t("tabMine");
    document.getElementById("tab-all-t").textContent=t("tabAll");
    document.getElementById("savebtn").textContent=t("save");
    document.getElementById("who-title").textContent=t("title");
    document.getElementById("whobtn-t").textContent=t("whoQ");
    var hello=document.getElementById("hello");hello.textContent="";
    var p=personById(whoId);
    if(p){hello.appendChild(document.createTextNode(t("hello")));hello.appendChild(h("b",null,p.name));
      hello.appendChild(h("button",{type:"button",onclick:openWho},t("notMe")))}
    hello.hidden=!p;
    setMsg(msgKey,msgCls);
    if(statusKey)showBanner(statusKey);
    var s=document.getElementById("langsw");s.textContent="";
    ["es","ca"].forEach(function(c){
      s.appendChild(h("button",{type:"button",class:c===lang?"on":"",title:c==="es"?"Castellano":"Català","aria-label":c==="es"?"Castellano":"Català",onclick:function(){setLang(c,false)}},flag(c)));
    });
  }
  function rerender(){applyStatic();renderMine();if(tab==="all")renderAll()}

  function setLang(c,fromGate){
    lang=c;hasLang=true;
    try{localStorage.setItem("ai_lang",c)}catch(e){}
    rerender();
    if(fromGate){
      hideScreen(document.getElementById("gate"),function(){if(!whoId)openWho()});
    }
  }
  (function buildGate(){
    var box=document.getElementById("gatebtns");
    [["es","Castellano"],["ca","Català"]].forEach(function(p){
      box.appendChild(h("button",{type:"button",onclick:function(){setLang(p[0],true)}},flag(p[0]),h("span",null,p[1])));
    });
    var g=document.getElementById("gate");g.hidden=hasLang;
    if(!hasLang)showScreen(g);
  })();

  /* ---------- Quién eres ---------- */
  function buildWho(){
    var inner=document.getElementById("whoinner");inner.textContent="";
    PEOPLE.forEach(function(p){
      inner.appendChild(h("button",{type:"button",onclick:function(){chooseWho(p.id)}},p.name));
    });
  }
  function toggleWhoList(open){
    var b=document.getElementById("whobtn"),l=document.getElementById("wholist");
    if(open===undefined)open=!l.classList.contains("open");
    l.classList.toggle("open",open);b.setAttribute("aria-expanded",open);
  }
  document.getElementById("whobtn").addEventListener("click",function(){toggleWhoList()});
  function openWho(){
    if(dirty&&!confirm_ok())return;
    buildWho();toggleWhoList(false);
    document.getElementById("whobtn-t").textContent=t("whoQ");
    showScreen(document.getElementById("who"));
  }
  function confirm_ok(){return true} // sin diálogos del navegador: los cambios sin guardar se descartan al cambiar de persona
  function chooseWho(id){
    whoId=id;
    try{localStorage.setItem("ai_who",id)}catch(e){}
    document.getElementById("whobtn-t").textContent=personById(id).name;
    setTimeout(function(){
      hideScreen(document.getElementById("who"),function(){
        applyStatic();
        if(loaded)loadDraft();else renderMine();
        if(tab==="all")renderList();
        window.scrollTo(0,0);
      });
    },250);
  }

  /* ---------- Tabs ---------- */
  function setTab(tb){
    tab=tb;
    document.getElementById("tab-mine").setAttribute("aria-selected",tb==="mine");
    document.getElementById("tab-all").setAttribute("aria-selected",tb==="all");
    document.getElementById("view-mine").hidden=tb!=="mine";
    document.getElementById("view-all").hidden=tb!=="all";
    document.getElementById("savebar").style.display=tb==="mine"?"flex":"none";
    if(tb==="all")renderAll();
  }
  document.getElementById("tab-mine").addEventListener("click",function(){setTab("mine")});
  document.getElementById("tab-all").addEventListener("click",function(){setTab("all")});

  /* ---------- Guardar ---------- */
  document.getElementById("savebtn").addEventListener("click",async function(){
    var btn=this,p=personById(whoId);
    if(!CONFIGURED||saving||!p)return;
    var items=draft.items.filter(function(i){return (i.name||"").trim()||(i.url||"").trim()}).map(function(i){
      return{id:i.id,name:(i.name||"").trim(),cat:catCode(i.cat),url:(i.url||"").trim(),price:(i.price||"").trim(),size:(i.size||"").trim(),color:(i.color||"").trim(),notes:(i.notes||"").trim(),top:!!i.top};
    });
    saving=true;btn.disabled=true;setMsg("saving");
    try{
      await sb("POST","wishlists?on_conflict=id",[{id:p.id,name:p.name,items:items,updated:Date.now()}],{Prefer:"resolution=merge-duplicates,return=minimal"});
      draft.items=items.length?items.map(function(i){return Object.assign({},i)}):[newItem()];
      dirty=false;setMsg("saved","ok");
      renderMine();
    }catch(e){
      setMsg("saveErr","err");btn.disabled=false;
    }
    saving=false;
  });
  window.addEventListener("beforeunload",function(e){if(dirty){e.preventDefault();e.returnValue=""}});

  /* ---------- Arranque ---------- */
  function docData(d){return typeof d.data==="function"?d.data():d.data}

  async function fetchAll(){
    try{
      var rows=await sb("GET","wishlists?select=id,name,items,updated");
      var next={};rows.forEach(function(r){next[r.id]=r});
      all=next;
      var b=document.getElementById("status");b.hidden=true;statusKey=null;
      if(!loaded){loaded=true;if(whoId)loadDraft();else setMsg("ready")}
      if(tab==="all")renderList();
      else document.getElementById("count").textContent=withItems();
    }catch(e){
      if(!loaded){showBanner("needLogin");setMsg("offline")}
    }
  }
  function init(){
    applyStatic();setTab("mine");
    if(hasLang&&!whoId)openWho();
    if(!CONFIGURED){showBanner("needLogin");setMsg("offline");return}
    fetchAll();
    setInterval(fetchAll,20000);
    document.addEventListener("visibilitychange",function(){if(!document.hidden)fetchAll()});
  }
  init();
})();
</script>
</body>
</html>
